# App names are global on Fly; change this if it's taken.
app = "dumpling-relay"
primary_region = "sjc"

[build]

[env]
  DATABASE_URL = "sqlite:////data/dumpling.db"

# SQLite lives on this volume, so the app must run on exactly one machine (deploy with --ha=false).
[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
