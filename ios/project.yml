name: Dumpling
options:
  bundleIdPrefix: com.dumpling  # ACCOUNT PENDING: replace with your Apple Developer team prefix
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    DEVELOPMENT_TEAM: ""  # ACCOUNT PENDING: set your Apple Developer Team ID

targets:

  Dumpling:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: DumplingApp
        createIntermediateGroups: true
    resources:
      - path: DumplingApp/Assets.xcassets
    info:
      path: DumplingApp/Info.plist
      properties:
        CFBundleDisplayName: Dumpling
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchStoryboardName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: DumplingApp/Dumpling.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.dumpling.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dumpling.app
        INFOPLIST_FILE: DumplingApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  DumplingShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: DumplingShareExtension
        createIntermediateGroups: true
    info:
      path: DumplingShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Dumpling
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionActivationRule:
            NSExtensionActivationSupportsWebURLWithMaxCount: 1
            NSExtensionActivationSupportsText: true
            NSExtensionActivationSupportsImageWithMaxCount: 1
    entitlements:
      path: DumplingShareExtension/DumplingShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.dumpling.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dumpling.app.ShareExtension
        INFOPLIST_FILE: DumplingShareExtension/Info.plist

schemes:
  Dumpling:
    build:
      targets:
        Dumpling: all
        DumplingShareExtension: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
