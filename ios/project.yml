name: Dumpling
options:
  bundleIdPrefix: com.kidhack
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: FVJVPTJ48N
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGN_STYLE: Automatic

targets:

  Dumpling:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    dependencies:
      - target: DumplingShareExtension
        embed: true
    sources:
      - path: DumplingApp
        createIntermediateGroups: true
      - path: Shared
    resources:
      - path: DumplingApp/Assets.xcassets
    info:
      path: DumplingApp/Info.plist
      properties:
        CFBundleDisplayName: Dumpling
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "3"
        UILaunchStoryboardName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSRemindersFullAccessUsageDescription: Dumpling adds the tasks you share to a "Dumpling" list in Reminders.
        NSCalendarsFullAccessUsageDescription: Dumpling adds the events you share to your calendar, checks for ones you've already added so it doesn't duplicate them, and links to them.
    entitlements:
      path: DumplingApp/Dumpling.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kidhack.dumpling
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kidhack.dumpling
        INFOPLIST_FILE: DumplingApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  DumplingShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: DumplingShareExtension
        createIntermediateGroups: true
      - path: Shared
    info:
      path: DumplingShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Dumpling
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "3"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          # The activation rule MUST live inside NSExtensionAttributes, or iOS never shows the extension.
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 1
    entitlements:
      path: DumplingShareExtension/DumplingShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kidhack.dumpling
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kidhack.dumpling.ShareExtension
        INFOPLIST_FILE: DumplingShareExtension/Info.plist

schemes:
  Dumpling:
    build:
      targets:
        Dumpling: all
        DumplingShareExtension: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  DumplingShareExtension:
    build:
      targets:
        Dumpling: all
        DumplingShareExtension: all
    run:
      config: Debug
      askForAppToLaunch: true
      launchAutomaticallySubstyle: "2"
    analyze:
      config: Debug
    archive:
      config: Release
